spring.application.name=AgricultureFarmManagement


spring.datasource.url=jdbc:mysql://localhost:3306/agriculturefarmmanagement?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your password


spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


server.port=8080


logging.level.root=INFO
logging.level.com.example.agriculture=DEBUG
logging.file.name=application.log

spring.security.user.name=admin
spring.security.user.password=admin123

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

spring.datasource.hikari.pool-name=MyPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

scheduler.farmer-report.rate=60000
scheduler.farm-report.rate=60000
scheduler.field-monitoring.rate=60000
scheduler.crop-monitoring.rate=60000
scheduler.activity-reminder.rate=60000
scheduler.expense-report.rate=60000
scheduler.harvest-reminder.rate=60000

